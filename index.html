<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Kingdom Map — Territory Overview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1420;
    --panel:#161d2b;
    --panel-2:#1c2436;
    --grid:#26314a;
    --grid-major:#334165;
    --text:#e9e4d3;
    --text-dim:#8c93a8;
    --gold:#c9a961;
    --crimson:#b3432f;
    --teal:#4a9d8f;
    --steel:#5b7ba6;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    overflow:hidden;
  }
  .app{
    display:flex;
    flex-direction:column;
    height:100vh;
  }
  header{
    display:flex;
    align-items:center;
    gap:20px;
    padding:16px 24px;
    background:linear-gradient(180deg, var(--panel-2), var(--panel));
    border-bottom:1px solid var(--grid-major);
    flex-wrap:wrap;
    z-index:20;
    position:relative;
  }
  .title-block{display:flex; align-items:baseline; gap:10px;}
  h1{
    font-family:'Cinzel', serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.5px;
    color:var(--gold);
    white-space:nowrap;
  }
  .subtitle{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
    letter-spacing:0.5px;
  }
  .search-wrap{
    position:relative;
    flex:1;
    min-width:220px;
    max-width:380px;
  }
  #search{
    width:100%;
    background:var(--bg);
    border:1px solid var(--grid-major);
    color:var(--text);
    padding:10px 14px;
    border-radius:6px;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    outline:none;
    transition:border-color .15s;
  }
  #search:focus{ border-color:var(--gold); }
  #search::placeholder{ color:var(--text-dim); }
  .dropdown{
    position:absolute;
    top:calc(100% + 6px);
    left:0;
    right:0;
    background:var(--panel-2);
    border:1px solid var(--grid-major);
    border-radius:6px;
    max-height:260px;
    overflow-y:auto;
    display:none;
    box-shadow:0 8px 24px rgba(0,0,0,.5);
    z-index:30;
  }
  .dropdown.open{ display:block; }
  .dd-item{
    padding:9px 14px;
    cursor:pointer;
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    border-bottom:1px solid var(--grid);
  }
  .dd-item:last-child{ border-bottom:none; }
  .dd-item:hover, .dd-item.active{ background:rgba(201,169,97,0.12); }
  .dd-name{ color:var(--text); font-weight:500; }
  .dd-power{ font-family:'JetBrains Mono', monospace; font-size:11px; color:var(--gold); }
  .dd-coord{ font-family:'JetBrains Mono', monospace; font-size:10px; color:var(--text-dim); margin-left:8px;}
  .stats{
    display:flex;
    gap:22px;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
    white-space:nowrap;
  }
  .stats b{ color:var(--gold); font-weight:600; }
  .main{
    flex:1;
    display:flex;
    position:relative;
    overflow:hidden;
  }
  #mapWrap{
    flex:1;
    position:relative;
    cursor:grab;
    background:
      radial-gradient(ellipse at 30% 20%, rgba(74,157,143,0.06), transparent 60%),
      radial-gradient(ellipse at 70% 80%, rgba(179,67,47,0.06), transparent 60%),
      var(--bg);
  }
  #mapWrap.dragging{ cursor:grabbing; }
  svg{ width:100%; height:100%; display:block; }
  .grid-line{ stroke:var(--grid); stroke-width:1; }
  .grid-line.major{ stroke:var(--grid-major); }
  .axis-label{
    fill:var(--text-dim);
    font-family:'JetBrains Mono', monospace;
    font-size:9px;
  }
  .node{ cursor:pointer; transition:opacity .2s; }
  .node circle.halo{ opacity:0; transition:opacity .2s; }
  .node:hover circle.halo, .node.highlight circle.halo{ opacity:0.35; }
  .node.dimmed{ opacity:0.18; }
  .node.highlight circle.core{ stroke:var(--gold); stroke-width:2; }
  .node-label{
    fill:var(--text);
    font-family:'Inter', sans-serif;
    font-size:9px;
    font-weight:500;
    pointer-events:none;
    opacity:0;
    transition:opacity .15s;
  }
  .node:hover .node-label, .node.highlight .node-label{ opacity:1; }
  .sweep{
    transform-origin:center;
    animation:sweep 2.2s ease-out 1;
  }
  @keyframes sweep{
    from{ stroke-dashoffset:0; opacity:1;}
    to{ stroke-dashoffset:0; opacity:0;}
  }
  #tooltip{
    position:fixed;
    pointer-events:none;
    background:var(--panel-2);
    border:1px solid var(--gold);
    border-radius:6px;
    padding:10px 14px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    color:var(--text);
    z-index:100;
    display:none;
    box-shadow:0 8px 20px rgba(0,0,0,.5);
    min-width:150px;
  }
  #tooltip .t-name{ font-family:'Inter',sans-serif; font-weight:600; font-size:13px; color:var(--gold); margin-bottom:4px; }
  #tooltip .t-row{ display:flex; justify-content:space-between; gap:16px; color:var(--text-dim); }
  #tooltip .t-row span:last-child{ color:var(--text); }

  aside{
    width:230px;
    background:var(--panel);
    border-left:1px solid var(--grid-major);
    padding:20px 18px;
    overflow-y:auto;
    flex-shrink:0;
  }
  aside h2{
    font-family:'Cinzel', serif;
    font-size:13px;
    color:var(--gold);
    letter-spacing:0.5px;
    margin-bottom:14px;
    text-transform:uppercase;
  }
  .legend-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:10px;
    font-size:12px;
    color:var(--text-dim);
  }
  .swatch{
    width:12px; height:12px;
    border-radius:50%;
    flex-shrink:0;
  }
  .controls{
    margin-top:24px;
    font-size:11px;
    color:var(--text-dim);
    line-height:1.8;
    font-family:'JetBrains Mono', monospace;
  }
  .controls b{ color:var(--text); }
  #detailCard{
    margin-top:24px;
    padding:14px;
    background:var(--panel-2);
    border:1px solid var(--grid-major);
    border-radius:8px;
    display:none;
  }
  #detailCard.show{ display:block; }
  #detailCard .d-name{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:14px;
    color:var(--gold);
    margin-bottom:8px;
  }
  #detailCard .d-row{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    font-family:'JetBrains Mono', monospace;
    color:var(--text-dim);
    margin-bottom:4px;
  }
  #detailCard .d-row span:last-child{ color:var(--text); }
  #zoomCtl{
    position:absolute;
    bottom:20px;
    right:20px;
    display:flex;
    flex-direction:column;
    gap:6px;
    z-index:15;
  }
  #zoomCtl button{
    width:32px; height:32px;
    background:var(--panel-2);
    border:1px solid var(--grid-major);
    color:var(--text);
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
  }
  #zoomCtl button:hover{ border-color:var(--gold); color:var(--gold); }

  #lockScreen{
    position:fixed;
    inset:0;
    background:var(--bg);
    display:flex;
    align-items:center;
    justify-content:center;
    z-index:1000;
  }
  #lockScreen.hidden{ display:none; }
  .lock-card{
    background:var(--panel-2);
    border:1px solid var(--grid-major);
    border-radius:10px;
    padding:36px 34px;
    width:300px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.6);
  }
  .lock-card h1{
    font-family:'Cinzel', serif;
    color:var(--gold);
    font-size:19px;
    margin-bottom:6px;
  }
  .lock-card p{
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    color:var(--text-dim);
    margin-bottom:20px;
  }
  #lockInput{
    width:100%;
    background:var(--bg);
    border:1px solid var(--grid-major);
    color:var(--text);
    padding:11px 14px;
    border-radius:6px;
    font-family:'JetBrains Mono', monospace;
    font-size:14px;
    outline:none;
    text-align:center;
    letter-spacing:2px;
    margin-bottom:12px;
  }
  #lockInput:focus{ border-color:var(--gold); }
  #lockBtn{
    width:100%;
    background:var(--gold);
    border:none;
    color:var(--bg);
    padding:11px 14px;
    border-radius:6px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:13px;
    cursor:pointer;
    letter-spacing:0.3px;
  }
  #lockBtn:hover{ opacity:0.9; }
  #lockError{
    color:var(--crimson);
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    margin-top:10px;
    height:14px;
  }

  @media (max-width: 720px){
    aside{ display:none; }
    header{ padding:12px 14px; gap:10px; }
    h1{ font-size:17px; }
    .subtitle{ display:none; }
    .stats{ display:none; }
  }
</style>
</head>

<div id="lockScreen">
  <div class="lock-card">
    <h1>Kingdom Map</h1>

      </div>
    </aside>
  </div>
</div>
<div id="tooltip"></div>

// Change PASSCODE below to whatever you want the shared password to be.
// Note: this is a simple front-end lock (deters casual visitors / link-guessers),

const lockScreen = document.getElementById('lockScreen');
const lockInput = document.getElementById('lockInput');
const lockBtn = document.getElementById('lockBtn');
const lockError = document.getElementById('lockError');

function tryUnlock(){
  if(lockInput.value === PASSCODE){
    lockScreen.classList.add('hidden');
  } else {
    lockError.textContent = 'Incorrect passcode';
    lockInput.value = '';
    lockInput.focus();
  }
}
lockBtn.addEventListener('click', tryUnlock);
lockInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryUnlock(); });
lockInput.focus();

// sort for ranking
const ranked = [...DATA].sort((a,b)=>b.power-a.power);
ranked.forEach((d,i)=>{ d.rank = i+1; });
const rankMap = new Map(DATA.map(d=>[d.name+d.x+d.y, ranked.find(r=>r.name===d.name && r.x===d.x && r.y===d.y).rank]));

const svg = document.getElementById('svg');
const viewport = document.getElementById('viewport');
const mapWrap = document.getElementById('mapWrap');
const tooltip = document.getElementById('tooltip');

const xs = DATA.map(d=>d.x), ys = DATA.map(d=>d.y);
const minX = Math.min(...xs), maxX = Math.max(...xs);
const minY = Math.min(...ys), maxY = Math.max(...ys);
const padX = (maxX-minX)*0.18 || 2;
const padY = (maxY-minY)*0.18 || 2;
const worldX0 = minX-padX, worldX1 = maxX+padX;
const worldY0 = minY-padY, worldY1 = maxY+padY;

const VB_W = 1000, VB_H = 700;
function worldToScreen(x,y){
  const sx = (x-worldX0)/(worldX1-worldX0)*VB_W;
  const sy = VB_H - (y-worldY0)/(worldY1-worldY0)*VB_H; // invert y so higher Y draws near "top"
  return [sx,sy];
}

function powerColor(p){
  if(p < 40000000) return '#4a9d8f';
  if(p < 70000000) return '#5b7ba6';
  if(p < 110000000) return '#c9a961';
  return '#b3432f';
}
function powerRadius(p){
  const r = 4 + Math.sqrt(p)/1400;
  return Math.min(Math.max(r,4), 16);
}
function fmt(n){ return n.toLocaleString('en-US'); }

// build grid
const gridSpacing = 2; // world units
function buildGrid(){
  let out = '';
  for(let gx = Math.ceil(worldX0/gridSpacing)*gridSpacing; gx<=worldX1; gx+=gridSpacing){
    const [sx1,sy1] = worldToScreen(gx, worldY0);
    const [sx2,sy2] = worldToScreen(gx, worldY1);
    const major = gx % (gridSpacing*5) === 0;
    out += `<line class="grid-line${major?' major':''}" x1="${sx1}" y1="${sy1}" x2="${sx2}" y2="${sy2}"></line>`;
    if(major){
      out += `<text class="axis-label" x="${sx1+3}" y="${VB_H-6}">${gx}</text>`;
    }
  }
  for(let gy = Math.ceil(worldY0/gridSpacing)*gridSpacing; gy<=worldY1; gy+=gridSpacing){
    const [sx1,sy1] = worldToScreen(worldX0, gy);
    const [sx2,sy2] = worldToScreen(worldX1, gy);
    const major = gy % (gridSpacing*5) === 0;
    out += `<line class="grid-line${major?' major':''}" x1="${sx1}" y1="${sy1}" x2="${sx2}" y2="${sy2}"></line>`;
    if(major){
      out += `<text class="axis-label" x="4" y="${sy1-3}">${gy}</text>`;
    }
  }
  return out;
}

function buildNodes(){
  let out = '';
  DATA.forEach((d,i)=>{
    const [sx,sy] = worldToScreen(d.x,d.y);
    const r = powerRadius(d.power);
    const c = powerColor(d.power);
    out += `<g class="node" data-idx="${i}" transform="translate(${sx},${sy})">
      <circle class="halo" r="${r+9}" fill="${c}"></circle>
      <circle class="core" r="${r}" fill="${c}" fill-opacity="0.85" stroke="rgba(0,0,0,0.4)" stroke-width="1"></circle>
      <text class="node-label" x="${r+5}" y="4">${escapeHtml(d.name)}</text>
    </g>`;
  });
  return out;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

viewport.innerHTML = buildGrid() + buildNodes();

// stats
document.getElementById('stats').innerHTML = `
  <span><b>${DATA.length}</b> kingdoms</span>
  <span>avg <b>${fmt(Math.round(DATA.reduce((s,d)=>s+d.power,0)/DATA.length))}</b></span>
  <span>top <b>${fmt(ranked[0].power)}</b> (${escapeHtml(ranked[0].name)})</span>
`;

// pan / zoom state
let scale = 1, tx = 0, ty = 0;
let isDragging = false, lastX=0, lastY=0, dragged=false;

function applyTransform(){
  viewport.setAttribute('transform', `translate(${tx},${ty}) scale(${scale})`);
}

mapWrap.addEventListener('wheel', (e)=>{
  e.preventDefault();
  const rect = mapWrap.getBoundingClientRect();
  const mx = (e.clientX-rect.left)/rect.width*VB_W;
  const my = (e.clientY-rect.top)/rect.height*VB_H;
  const delta = e.deltaY < 0 ? 1.15 : 1/1.15;
  const newScale = Math.min(Math.max(scale*delta, 0.6), 12);
  // keep cursor position fixed
  tx = mx - (mx-tx)*(newScale/scale);
  ty = my - (my-ty)*(newScale/scale);
  scale = newScale;
  applyTransform();
}, {passive:false});

mapWrap.addEventListener('mousedown', (e)=>{
  isDragging = true; dragged = false;
  lastX = e.clientX; lastY = e.clientY;
  mapWrap.classList.add('dragging');
});
window.addEventListener('mousemove', (e)=>{
  if(!isDragging) return;
  const dx = e.clientX-lastX, dy = e.clientY-lastY;
  if(Math.abs(dx)>2||Math.abs(dy)>2) dragged = true;
  const rect = mapWrap.getBoundingClientRect();
  tx += dx/rect.width*VB_W;
  ty += dy/rect.height*VB_H;
  lastX = e.clientX; lastY = e.clientY;
  applyTransform();
});
window.addEventListener('mouseup', ()=>{
  isDragging = false;
  mapWrap.classList.remove('dragging');
});

document.getElementById('zoomIn').onclick = ()=>{ scale = Math.min(scale*1.3,12); applyTransform(); };
document.getElementById('zoomOut').onclick = ()=>{ scale = Math.max(scale/1.3,0.6); applyTransform(); };
document.getElementById('zoomReset').onclick = ()=>{ scale=1; tx=0; ty=0; applyTransform(); };

// node interactions
viewport.addEventListener('mousemove', (e)=>{
  const g = e.target.closest('.node');
  if(!g){ tooltip.style.display='none'; return; }
  const d = DATA[g.dataset.idx];
  tooltip.innerHTML = `<div class="t-name">${escapeHtml(d.name)}</div>
    <div class="t-row"><span>X,Y</span><span>${d.x}, ${d.y}</span></div>
    <div class="t-row"><span>Power</span><span>${fmt(d.power)}</span></div>
    <div class="t-row"><span>Rank</span><span>#${rankOf(d)}</span></div>`;
  tooltip.style.left = (e.clientX+16)+'px';
  tooltip.style.top = (e.clientY+16)+'px';
  tooltip.style.display = 'block';
});
viewport.addEventListener('mouseleave', ()=>{ tooltip.style.display='none'; });

function rankOf(d){
  return ranked.findIndex(r=>r===d || (r.name===d.name && r.x===d.x && r.y===d.y)) + 1;
}

viewport.addEventListener('click', (e)=>{
  if(dragged) return;
  const g = e.target.closest('.node');
  if(!g) return;
  const d = DATA[g.dataset.idx];
  showDetail(d);
  focusNode(d);
});

function showDetail(d){
  document.getElementById('detailCard').classList.add('show');
  document.getElementById('dName').textContent = d.name;
  document.getElementById('dCoord').textContent = `X:${d.x}  Y:${d.y}`;
  document.getElementById('dPower').textContent = fmt(d.power);
  document.getElementById('dRank').textContent = `#${rankOf(d)} of ${DATA.length}`;
}

function focusNode(d){
  const [sx,sy] = worldToScreen(d.x,d.y);
  scale = 4;
  tx = VB_W/2 - sx*scale;
  ty = VB_H/2 - sy*scale;
  applyTransform();
  document.querySelectorAll('.node').forEach(n=>n.classList.remove('highlight','dimmed'));
  const idx = DATA.indexOf(d);
  document.querySelectorAll('.node').forEach(n=>{
    if(parseInt(n.dataset.idx)===idx) n.classList.add('highlight');
    else n.classList.add('dimmed');
  });
}

function clearHighlight(){
  document.querySelectorAll('.node').forEach(n=>n.classList.remove('highlight','dimmed'));
}

// search
const searchInput = document.getElementById('search');
const dropdown = document.getElementById('dropdown');
let activeIdx = -1;
let currentMatches = [];

searchInput.addEventListener('input', ()=>{
  const q = searchInput.value.trim().toLowerCase();
  if(!q){ dropdown.classList.remove('open'); clearHighlight(); return; }
  currentMatches = DATA.filter(d=>d.name.toLowerCase().includes(q)).sort((a,b)=>b.power-a.power).slice(0,20);
  activeIdx = -1;
  renderDropdown();
});

function renderDropdown(){
  if(currentMatches.length===0){
    dropdown.innerHTML = `<div class="dd-item" style="color:var(--text-dim);cursor:default;">No matches</div>`;
    dropdown.classList.add('open');
    return;
  }
  dropdown.innerHTML = currentMatches.map((d,i)=>`
    <div class="dd-item${i===activeIdx?' active':''}" data-i="${i}">
      <span class="dd-name">${escapeHtml(d.name)}<span class="dd-coord">X:${d.x} Y:${d.y}</span></span>
      <span class="dd-power">${fmt(d.power)}</span>
    </div>`).join('');
  dropdown.classList.add('open');
  dropdown.querySelectorAll('.dd-item').forEach(el=>{
    el.addEventListener('click', ()=>{
      const d = currentMatches[parseInt(el.dataset.i)];
      selectResult(d);
    });
  });
}

function selectResult(d){
  searchInput.value = d.name;
  dropdown.classList.remove('open');
  showDetail(d);
  focusNode(d);
}

searchInput.addEventListener('keydown', (e)=>{
  if(!dropdown.classList.contains('open')) return;
  if(e.key==='ArrowDown'){ e.preventDefault(); activeIdx = Math.min(activeIdx+1, currentMatches.length-1); renderDropdown(); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); activeIdx = Math.max(activeIdx-1, 0); renderDropdown(); }
  else if(e.key==='Enter'){ e.preventDefault(); if(currentMatches[activeIdx]) selectResult(currentMatches[activeIdx]); else if(currentMatches[0]) selectResult(currentMatches[0]); }
  else if(e.key==='Escape'){ dropdown.classList.remove('open'); }
});

document.addEventListener('click', (e)=>{
  if(!e.target.closest('.search-wrap')) dropdown.classList.remove('open');
});

applyTransform();
</script>
</body>
</html>
